services:
  postgres:
    image: postgres:18
    container_name: chat-mattu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_mattu}
      POSTGRES_USER: ${POSTGRES_USER:-chat_mattu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_mattu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat_mattu} -d ${POSTGRES_DB:-chat_mattu}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
