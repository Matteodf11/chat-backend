spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  application:
    name: chat-backend
  profiles:
    default: local
security:
  message-encryption-key: ${MESSAGE_ENCRYPTION_KEY}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    avatar-bucket: ${SUPABASE_AVATAR_BUCKET:avatars}
    attachment-bucket: ${SUPABASE_ATTACHMENT_BUCKET:attachments}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
