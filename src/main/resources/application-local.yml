server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat_mattu}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:chat_mattu}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:chat_mattu}}
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 2
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
