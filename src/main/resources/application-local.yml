server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat_mattu}
    username: ${DB_USERNAME:chat_mattu}
    password: ${DB_PASSWORD:chat_mattu}
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
